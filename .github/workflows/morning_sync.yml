name: Daily Freight Notion Sync

on:
  schedule:
    - cron: '0 11 * * *'   # Automatically triggers at 7:00 AM Eastern every morning
  workflow_dispatch:      # Adds a manual button so you can test it anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tools
        run: pip install beautifulsoup4 requests

      - name: Run sync script
        run: python sync.py
